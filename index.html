<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Management Simulator - Risico & Rendement</title>
    <!-- Gebruik stabiele versies van React en ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <style>
      body {
        background-color: #f8fafc;
      }
      .recharts-legend-item {
        font-size: 12px !important;
        font-weight: 600 !important;
      }
      input[type="range"] {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const {
        ComposedChart,
        Line,
        XAxis,
        YAxis,
        CartesianGrid,
        Tooltip,
        Legend,
        ResponsiveContainer,
        Area,
        BarChart,
        Bar,
      } = window.Recharts;

      const { useState, useEffect, useMemo } = React;

      const Icon = ({ name, className = "w-4 h-4" }) => {
        const icons = {
          Zap: <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />,
          LayoutDashboard: (
            <path d="M3 3h7v9H3zm11 0h7v5h-7zm0 9h7v9h-7zm-11 11h7v-7H3z" />
          ),
          BookOpen: (
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zm20 0h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          ),
          RefreshCcw: (
            <path d="M1 4v6h6M23 20v-6h-6M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
          ),
          ShieldCheck: (
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zm-2-9l2 2 4-4" />
          ),
          TrendingUp: <path d="M23 6l-9.5 9.5-5-5L1 18m22-12h-6m6 0v6" />,
          ArrowDownCircle: (
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-14v8m-4-4l4 4 4-4" />
          ),
          AlertCircle: (
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-14v4m0 4h.01" />
          ),
          Trophy: (
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6m12 5h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-2.34M12 4v10" />
          ),
          Layers: (
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          ),
          Beaker: (
            <path d="M4.5 3h15M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3M6 14h12M12 3v11" />
          ),
        };
        return (
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
          >
            {icons[name] || icons.Zap}
          </svg>
        );
      };

      const App = () => {
        const [activeTab, setActiveTab] = useState("simulation");
        const [riskFreeRate, setRiskFreeRate] = useState(3);
        const [beta, setBeta] = useState(1);
        const [numSimulations, setNumSimulations] = useState(1000);
        const [results, setResults] = useState(null);
        const [isSimulating, setIsSimulating] = useState(false);

        // Historische AEX marktpremies (AEX rendement minus toenmalige risicovrije voet)
        const historicalData = useMemo(
          () =>
            [
              { year: 1984, return: 17.13, rf: 6.5 },
              { year: 1985, return: 41.69, rf: 5.75 },
              { year: 1986, return: -5.6, rf: 5.25 },
              { year: 1987, return: -32.1, rf: 4.5 },
              { year: 1988, return: 51.12, rf: 4.25 },
              { year: 1989, return: 16.07, rf: 7.0 },
              { year: 1990, return: -23.85, rf: 8.5 },
              { year: 1991, return: 20.87, rf: 9.25 },
              { year: 1992, return: 3.17, rf: 9.5 },
              { year: 1993, return: 44.93, rf: 7.0 },
              { year: 1994, return: 0.05, rf: 5.25 },
              { year: 1995, return: 17.1, rf: 4.75 },
              { year: 1996, return: 33.56, rf: 3.5 },
              { year: 1997, return: 40.95, rf: 3.25 },
              { year: 1998, return: 29.87, rf: 3.5 },
              { year: 1999, return: 24.69, rf: 3.0 },
              { year: 2000, return: -5.04, rf: 4.25 },
              { year: 2001, return: -20.52, rf: 4.5 },
              { year: 2002, return: -36.32, rf: 3.5 },
              { year: 2003, return: 4.62, rf: 2.5 },
              { year: 2004, return: 3.09, rf: 2.1 },
              { year: 2005, return: 25.48, rf: 2.2 },
              { year: 2006, return: 13.41, rf: 3.25 },
              { year: 2007, return: 4.12, rf: 4.25 },
              { year: 2008, return: -52.32, rf: 4.0 },
              { year: 2009, return: 36.35, rf: 1.5 },
              { year: 2010, return: 5.74, rf: 1.0 },
              { year: 2011, return: -11.87, rf: 1.5 },
              { year: 2012, return: 9.46, rf: 0.5 },
              { year: 2013, return: 17.24, rf: 0.25 },
              { year: 2014, return: 5.62, rf: 0.15 },
              { year: 2015, return: 4.11, rf: -0.05 },
              { year: 2016, return: 9.39, rf: -0.3 },
              { year: 2017, return: 12.71, rf: -0.6 },
              { year: 2018, return: -10.41, rf: -0.55 },
              { year: 2019, return: 23.9, rf: -0.5 },
              { year: 2020, return: 3.32, rf: -0.55 },
              { year: 2021, return: 27.75, rf: -0.6 },
              { year: 2022, return: -13.65, rf: 0.5 },
              { year: 2023, return: 14.22, rf: 3.25 },
            ].map((d) => ({ ...d, premium: (d.return - d.rf) / 100 })),
          []
        );

        const runSimulation = () => {
          setIsSimulating(true);
          setTimeout(() => {
            const horizon = 10;
            const initialInvestment = 10000;
            const allPaths = [];
            const rfPath = [initialInvestment];
            const currentRfDec = riskFreeRate / 100;

            for (let i = 1; i <= horizon; i++) {
              rfPath.push(rfPath[i - 1] * (1 + currentRfDec));
            }

            for (let s = 0; s < numSimulations; s++) {
              const path = [initialInvestment];
              for (let y = 1; y <= horizon; y++) {
                const randomIndex = Math.floor(
                  Math.random() * historicalData.length
                );
                const sampledPremium = historicalData[randomIndex].premium;
                const capmReturn = currentRfDec + beta * sampledPremium;
                const nextVal = Math.max(0, path[y - 1] * (1 + capmReturn));
                path.push(nextVal);
              }
              allPaths.push(path);
            }

            const finalValues = allPaths
              .map((p) => p[horizon])
              .sort((a, b) => a - b);
            const rfFinal = rfPath[horizon];
            const sumFinal = finalValues.reduce((a, b) => a + b, 0);

            const chartData = [];
            for (let y = 0; y <= horizon; y++) {
              const yearValues = allPaths
                .map((p) => p[y])
                .sort((a, b) => a - b);
              chartData.push({
                year: `Jaar ${y}`,
                riskFree: rfPath[y],
                median: yearValues[Math.floor(yearValues.length * 0.5)],
                p10: yearValues[Math.floor(yearValues.length * 0.1)],
                p90: yearValues[Math.floor(yearValues.length * 0.9)],
                ...Object.fromEntries(
                  allPaths.slice(0, 8).map((p, i) => [`sim${i}`, p[y]])
                ),
              });
            }

            setResults({
              chartData,
              rfFinal,
              probUnderperform:
                (finalValues.filter((v) => v < rfFinal).length /
                  numSimulations) *
                100,
              best: finalValues[finalValues.length - 1],
              worst: finalValues[0],
              avg: sumFinal / finalValues.length,
            });
            setIsSimulating(false);
          }, 100);
        };

        useEffect(() => {
          runSimulation();
        }, []);

        return (
          <div className="min-h-screen p-4 md:p-8 font-sans text-slate-900">
            <div className="max-w-7xl mx-auto space-y-6">
              <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div className="flex items-center gap-4">
                  <div className="p-3 bg-indigo-600 rounded-xl text-white shadow-lg">
                    <Icon
                      name="Zap"
                      className="w-8 h-8"
                    />
                  </div>
                  <div>
                    <h1 className="text-2xl font-bold text-slate-900 tracking-tight">
                      Management Simulator
                    </h1>
                    <p className="text-slate-500 text-sm italic text-wrap">
                      Strategische investeringsbeslissingen onderbouwd met AEX
                      data
                    </p>
                  </div>
                </div>
                <div className="flex bg-slate-100 p-1 rounded-xl">
                  <button
                    onClick={() => setActiveTab("simulation")}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${
                      activeTab === "simulation"
                        ? "bg-white text-indigo-600 shadow-sm"
                        : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    <Icon
                      name="LayoutDashboard"
                      className="w-4 h-4"
                    />{" "}
                    Simulator
                  </button>
                  <button
                    onClick={() => setActiveTab("explanation")}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${
                      activeTab === "explanation"
                        ? "bg-white text-indigo-600 shadow-sm"
                        : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    <Icon
                      name="BookOpen"
                      className="w-4 h-4"
                    />{" "}
                    Uitleg
                  </button>
                </div>
              </header>

              {activeTab === "simulation" ? (
                <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 animate-in fade-in duration-500">
                  <section className="lg:col-span-1 space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                      <h2 className="text-xs font-bold uppercase tracking-widest text-slate-400 mb-6 flex items-center gap-2">
                        <Icon
                          name="ShieldCheck"
                          className="w-4 h-4"
                        />{" "}
                        Instellingen
                      </h2>
                      <div className="space-y-6">
                        <div>
                          <div className="flex justify-between mb-2">
                            <label className="text-sm font-bold text-slate-700">
                              Risicovrije Voet (Sparen)
                            </label>
                            <span className="text-sm font-bold text-orange-600 bg-orange-50 px-2 rounded">
                              {riskFreeRate}%
                            </span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="8"
                            step="0.25"
                            value={riskFreeRate}
                            onChange={(e) =>
                              setRiskFreeRate(parseFloat(e.target.value))
                            }
                            className="w-full accent-orange-500 h-2 bg-slate-200 rounded-lg appearance-none"
                          />
                        </div>
                        <div>
                          <div className="flex justify-between mb-2">
                            <label className="text-sm font-bold text-slate-700">
                              Portfolio Beta (&beta;)
                            </label>
                            <span className="text-sm font-bold text-indigo-600 bg-blue-50 px-2 rounded">
                              {beta.toFixed(1)}
                            </span>
                          </div>
                          <input
                            type="range"
                            min="0.1"
                            max="4.0"
                            step="0.1"
                            value={beta}
                            onChange={(e) =>
                              setBeta(parseFloat(e.target.value))
                            }
                            className="w-full accent-indigo-600 h-2 bg-slate-200 rounded-lg appearance-none"
                          />
                        </div>
                        <div>
                          <label className="text-sm font-bold block mb-2 text-slate-700 flex items-center gap-2">
                            <Icon
                              name="Layers"
                              className="w-4 h-4"
                            />{" "}
                            Simulaties
                          </label>
                          <select
                            value={numSimulations}
                            onChange={(e) =>
                              setNumSimulations(parseInt(e.target.value))
                            }
                            className="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                          >
                            <option value="100">100 (Snel)</option>
                            <option value="1000">1.000 (Standaard)</option>
                            <option value="5000">5.000 (Nauwkeurig)</option>
                          </select>
                        </div>
                        <button
                          onClick={runSimulation}
                          disabled={isSimulating}
                          className="w-full bg-indigo-900 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 hover:bg-black transition-all"
                        >
                          <Icon
                            name="RefreshCcw"
                            className={`w-4 h-4 ${
                              isSimulating ? "animate-spin" : ""
                            }`}
                          />
                          {isSimulating ? "Simuleren..." : "Start Simulatie"}
                        </button>
                      </div>
                    </div>
                    <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl">
                      <h3 className="font-bold mb-4 text-sm flex items-center gap-2">
                        <Icon
                          name="AlertCircle"
                          className="w-4 h-4 text-orange-400"
                        />{" "}
                        Legenda
                      </h3>
                      <div className="space-y-4">
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-1 bg-orange-500 border-t border-dashed"></div>
                          <span className="text-xs font-semibold">
                            Sparen (Rf)
                          </span>
                        </div>
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-1.5 bg-indigo-600 rounded-full"></div>
                          <span className="text-xs font-semibold">
                            Beleggen (Mediaan)
                          </span>
                        </div>
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-3 bg-indigo-500/20 rounded-sm"></div>
                          <span className="text-xs font-semibold">
                            80% Kansgebied
                          </span>
                        </div>
                      </div>
                    </div>
                  </section>

                  <section className="lg:col-span-3 space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-[480px]">
                      {results && (
                        <ResponsiveContainer
                          width="100%"
                          height="100%"
                        >
                          <ComposedChart
                            data={results.chartData}
                            margin={{
                              top: 20,
                              right: 30,
                              left: 10,
                              bottom: 20,
                            }}
                          >
                            <CartesianGrid
                              strokeDasharray="3 3"
                              stroke="#f1f5f9"
                              vertical={false}
                            />
                            <XAxis
                              dataKey="year"
                              fontSize={11}
                              tickLine={false}
                              axisLine={false}
                            />
                            <YAxis
                              fontSize={11}
                              tickLine={false}
                              axisLine={false}
                              tickFormatter={(val) =>
                                `€${(val / 1000).toFixed(0)}k`
                              }
                            />
                            <Tooltip
                              contentStyle={{
                                borderRadius: "12px",
                                border: "none",
                                boxShadow: "0 10px 15px -3px rgba(0,0,0,0.1)",
                              }}
                              formatter={(value) =>
                                `€${Math.round(value).toLocaleString()}`
                              }
                            />

                            <Area
                              type="monotone"
                              dataKey="p90"
                              stroke="none"
                              fill="#4f46e5"
                              fillOpacity={0.15}
                              name="80% Kansgebied"
                              isAnimationActive={false}
                            />
                            <Area
                              type="monotone"
                              dataKey="p10"
                              stroke="none"
                              fill="#ffffff"
                              fillOpacity={1}
                              legendType="none"
                              isAnimationActive={false}
                            />

                            {Array.from({ length: 8 }).map((_, i) => (
                              <Line
                                key={i}
                                type="monotone"
                                dataKey={`sim${i}`}
                                stroke="#4f46e5"
                                strokeWidth={1}
                                strokeOpacity={0.15}
                                dot={false}
                                legendType="none"
                                isAnimationActive={false}
                              />
                            ))}

                            <Line
                              type="monotone"
                              dataKey="p90"
                              stroke="#64748b"
                              strokeWidth={1}
                              strokeDasharray="4 4"
                              dot={false}
                              legendType="none"
                              isAnimationActive={false}
                            />
                            <Line
                              type="monotone"
                              dataKey="p10"
                              stroke="#64748b"
                              strokeWidth={1}
                              strokeDasharray="4 4"
                              dot={false}
                              legendType="none"
                              isAnimationActive={false}
                            />

                            <Line
                              type="monotone"
                              dataKey="riskFree"
                              stroke="#f59e0b"
                              strokeWidth={4}
                              strokeDasharray="8 4"
                              name="Sparen"
                              isAnimationActive={false}
                              dot={{
                                r: 4,
                                fill: "#f59e0b",
                                strokeWidth: 2,
                                stroke: "#fff",
                              }}
                            />
                            <Line
                              type="monotone"
                              dataKey="median"
                              stroke="#4338ca"
                              strokeWidth={5}
                              name="Beleggen"
                              isAnimationActive={false}
                              dot={{
                                r: 5,
                                fill: "#4338ca",
                                strokeWidth: 2,
                                stroke: "#fff",
                              }}
                            />

                            <Legend
                              verticalAlign="top"
                              height={60}
                              iconType="plainline"
                            />
                          </ComposedChart>
                        </ResponsiveContainer>
                      )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-center">
                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <p className="text-slate-400 text-[10px] font-bold uppercase mb-1">
                          Sparen
                        </p>
                        <p className="text-xl font-black text-slate-800">
                          €
                          {results
                            ? Math.round(results.rfFinal).toLocaleString()
                            : "..."}
                        </p>
                        <p className="text-[9px] text-slate-400 italic">
                          Zekerheid
                        </p>
                      </div>
                      <div className="bg-indigo-50 p-4 rounded-2xl border border-indigo-200 shadow-sm">
                        <p className="text-indigo-400 text-[10px] font-bold uppercase mb-1">
                          Beleggen (Mediaan)
                        </p>
                        <p className="text-xl font-black text-indigo-900">
                          €
                          {results
                            ? Math.round(
                                results.chartData[10].median
                              ).toLocaleString()
                            : "..."}
                        </p>
                        <p className="text-[9px] text-indigo-400 italic">
                          Meest waarschijnlijk
                        </p>
                      </div>
                      <div className="bg-blue-600 p-4 rounded-2xl shadow-sm text-white">
                        <p className="text-blue-100 text-[10px] font-bold uppercase mb-1">
                          Beleggen (Gemiddelde)
                        </p>
                        <p className="text-xl font-black">
                          €
                          {results
                            ? Math.round(results.avg).toLocaleString()
                            : "..."}
                        </p>
                        <p className="text-[9px] text-blue-100 italic">
                          Theoretisch midden
                        </p>
                      </div>
                      <div className="bg-rose-50 p-4 rounded-2xl border border-rose-100 shadow-sm text-center">
                        <p className="text-rose-900 text-[10px] font-bold uppercase mb-1">
                          Risico-Index
                        </p>
                        <p className="text-xl font-black text-rose-600">
                          {results
                            ? results.probUnderperform.toFixed(1)
                            : "..."}
                          %
                        </p>
                        <p className="text-[9px] text-rose-700 italic">
                          Kans verlies vs Sparen
                        </p>
                      </div>
                    </div>

                    {/* Extreme Scenario's (Geluksvogel & Pechvogel) */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-100 shadow-sm flex items-center gap-4">
                        <div className="p-3 bg-emerald-100 rounded-full text-emerald-600">
                          <Icon
                            name="Trophy"
                            className="w-6 h-6"
                          />
                        </div>
                        <div>
                          <p className="text-emerald-900 text-[10px] font-bold uppercase tracking-widest text-opacity-60">
                            "Geluksvogel" Scenario
                          </p>
                          <p className="text-2xl font-black text-emerald-700">
                            €
                            {results
                              ? Math.round(results.best).toLocaleString()
                              : "..."}
                          </p>
                          <p className="text-[9px] text-emerald-600 italic">
                            De beste uitkomst uit alle simulaties
                          </p>
                        </div>
                      </div>
                      <div className="bg-slate-200 p-5 rounded-2xl border border-slate-300 shadow-sm flex items-center gap-4 text-slate-700">
                        <div className="p-3 bg-slate-300 rounded-full">
                          <Icon
                            name="AlertCircle"
                            className="w-6 h-6"
                          />
                        </div>
                        <div>
                          <p className="text-slate-900 text-[10px] font-bold uppercase tracking-widest text-opacity-60">
                            "Pechvogel" Scenario
                          </p>
                          <p className="text-2xl font-black">
                            €
                            {results
                              ? Math.round(results.worst).toLocaleString()
                              : "..."}
                          </p>
                          <p className="text-[9px] text-slate-500 italic">
                            De slechtste uitkomst uit alle simulaties
                          </p>
                        </div>
                      </div>
                    </div>
                  </section>
                </div>
              ) : (
                /* Uitleg Tabblad */
                <div className="bg-white p-8 rounded-3xl border border-slate-200 max-w-4xl mx-auto space-y-10 animate-in fade-in slide-in-from-bottom-4 duration-500">
                  <section>
                    <h2 className="text-3xl font-black text-slate-900 mb-6 underline decoration-indigo-500 underline-offset-8">
                      Hoe werkt het?
                    </h2>
                    <div className="space-y-8 text-slate-700 leading-relaxed text-lg">
                      <p>
                        Als manager maak je keuzes tussen veiligheid en groei.
                        In deze simulator zie je wat er gebeurt als we de
                        geschiedenis van de AEX 1.000 keer 'naspelen'.
                      </p>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-8">

                              </li>
                              <li className="flex justify-between">
                                <span>Jaar 2: -50% verlies</span>{" "}
                                <span>&rarr; €7.500</span>
                              </li>
                              <li className="flex justify-between font-bold pt-2 border-t text-rose-600">
                                <span>Eindstand:</span> <span>€7.500</span>
                              </li>
                            </ul>
                            <p className="text-xs mt-4 italic text-slate-500">

                          <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">

                            <p className="text-sm mb-4">

                            </p>
                            <ul className="text-sm space-y-2">
                              <li className="flex justify-between">
                                <span>Jaar 1: +5% winst</span>{" "}
                                <span>&rarr; €10.500</span>
                              </li>
                              <li className="flex justify-between">
                                <span>Jaar 2: -5% verlies</span>{" "}
                                <span>&rarr; €9.975</span>
                              </li>
                              <li className="flex justify-between font-bold pt-2 border-t text-emerald-600">
                                <span>Eindstand:</span> <span>€9.975</span>
                              </li>

                            <p className="text-xs mt-4 italic text-slate-500">

                          </div>
                        </div>
                        <p className="text-sm mt-6 font-medium text-indigo-600 border-l-4 border-indigo-200 pl-4">

                      </div>
                    </div>
                  </section>

                  <section className="bg-indigo-900 text-white p-8 rounded-3xl shadow-xl relative overflow-hidden">

                        <h4 className="font-bold text-blue-300 mb-2">

                      <div className="bg-white/10 p-5 rounded-2xl border border-white/20 backdrop-blur-sm">
