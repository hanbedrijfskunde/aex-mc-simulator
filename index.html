<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Management Simulator - AEX</title>
    <!-- Gebruik stabiele versies van React en ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Prop-Types is vereist voor de UMD-versie van Recharts -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS voor styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Recharts met specifieke versie voor stabiliteit -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <style>
      body {
        background-color: #f8fafc;
      }
      .recharts-legend-item {
        font-size: 12px !important;
        font-weight: 600 !important;
      }
      input[type="range"] {
        cursor: pointer;
      }
      /* Smooth transition voor tab switches */
      .fade-enter {
        opacity: 0;
        transform: translateY(10px);
      }
      .fade-enter-active {
        opacity: 1;
        transform: translateY(0);
        transition: all 500ms;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      // Destructure Recharts componenten van de globale Recharts variabele
      const {
        ComposedChart,
        Line,
        XAxis,
        YAxis,
        CartesianGrid,
        Tooltip,
        Legend,
        ResponsiveContainer,
        Area,
        Bar,
        ReferenceLine,
        BarChart,
      } = window.Recharts;

      const { useState, useEffect, useMemo } = React;

      // Inline SVG Iconen voor maximale compatibiliteit zonder externe icon-libraries
      const Icon = ({ name, className = "w-4 h-4" }) => {
        const icons = {
          Zap: <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />,
          LayoutDashboard: (
            <path d="M3 3h7v9H3zm11 0h7v5h-7zm0 9h7v9h-7zm-11 11h7v-7H3z" />
          ),
          BookOpen: (
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zm20 0h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          ),
          RefreshCcw: (
            <path d="M1 4v6h6M23 20v-6h-6M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
          ),
          ShieldCheck: (
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zm-2-9l2 2 4-4" />
          ),
          TrendingUp: <path d="M23 6l-9.5 9.5-5-5L1 18m22-12h-6m6 0v6" />,
          ArrowDownCircle: (
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-14v8m-4-4l4 4 4-4" />
          ),
          AlertCircle: (
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-14v4m0 4h.01" />
          ),
          Trophy: (
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6m12 5h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-2.34M12 4v10" />
          ),
          Layers: (
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          ),
          Beaker: (
            <path d="M4.5 3h15M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3M6 14h12M12 3v11" />
          ),
        };
        return (
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
          >
            {icons[name] || icons.Zap}
          </svg>
        );
      };

      const App = () => {
        const [activeTab, setActiveTab] = useState("simulation");
        const [riskFreeRate, setRiskFreeRate] = useState(3);
        const [beta, setBeta] = useState(1);
        const [numSimulations, setNumSimulations] = useState(1000);
        const [results, setResults] = useState(null);
        const [isSimulating, setIsSimulating] = useState(false);

        // Historische AEX data (1984-2023)
        const rawData = `
"Year","AEX annual return (%)"
"1983","–"
"1984","17.13"
"1985","41.69"
"1986","-5.60"
"1987","-32.10"
"1988","51.12"
"1989","16.07"
"1990","-23.85"
"1991","20.87"
"1992","3.17"
"1993","44.93"
"1994","0.05"
"1995","17.10"
"1996","33.56"
"1997","40.95"
"1998","29.87"
"1999","24.69"
"2000","-5.04"
"2001","-20.52"
"2002","-36.32"
"2003","4.62"
"2004","3.09"
"2005","25.48"
"2006","13.41"
"2007","4.12"
"2008","-52.32"
"2009","36.35"
"2010","5.74"
"2011","-11.87"
"2012","9.46"
"2013","17.24"
"2014","5.62"
"2015","4.11"
"2016","9.39"
"2017","12.71"
"2018","-10.41"
"2019","23.90"
"2020","3.32"
"2021","27.75"
"2022","-13.65"
"2023","14.22"
`;

        const historicalReturns = useMemo(() => {
          return rawData
            .split("\n")
            .slice(2)
            .map((line) => {
              const match = line.match(/"[^"]*","([^"]*)"/);
              return match ? parseFloat(match[1]) : null;
            })
            .filter((val) => val !== null && !isNaN(val));
        }, []);

        const runSimulation = () => {
          setIsSimulating(true);
          // Kleine vertraging voor UX feedback
          setTimeout(() => {
            const horizon = 10;
            const initialInvestment = 10000;
            const allPaths = [];
            const rfPath = [initialInvestment];

            // Bereken Risicovrije pad
            for (let i = 1; i <= horizon; i++) {
              rfPath.push(rfPath[i - 1] * (1 + riskFreeRate / 100));
            }

            // Monte Carlo Simulatie
            for (let s = 0; s < numSimulations; s++) {
              const path = [initialInvestment];
              for (let y = 1; y <= horizon; y++) {
                const randomIndex = Math.floor(
                  Math.random() * historicalReturns.length
                );
                const baseReturn = historicalReturns[randomIndex] / 100;
                const adjustedReturn = baseReturn * beta;
                path.push(path[y - 1] * (1 + adjustedReturn));
              }
              allPaths.push(path);
            }

            // Sorteer resultaten voor percentielen
            const finalValues = allPaths
              .map((p) => p[horizon])
              .sort((a, b) => a - b);
            const rfFinal = rfPath[horizon];
            const underperformCount = finalValues.filter(
              (v) => v < rfFinal
            ).length;

            // Histogram data
            const min = Math.min(...finalValues);
            const max = Math.max(...finalValues);
            const bins = 20;
            const binSize = (max - min) / bins;
            const histogramData = Array.from({ length: bins }, (_, i) => {
              const rangeMin = min + i * binSize;
              const count = finalValues.filter(
                (v) => v >= rangeMin && v < rangeMin + binSize
              ).length;
              return { range: `€${(rangeMin / 1000).toFixed(1)}k`, count };
            });

            // Tijdlijn data voor de grafiek
            const chartData = [];
            for (let y = 0; y <= horizon; y++) {
              const yearValues = allPaths
                .map((p) => p[y])
                .sort((a, b) => a - b);
              chartData.push({
                year: `Jaar ${y}`,
                riskFree: rfPath[y],
                median: yearValues[Math.floor(yearValues.length * 0.5)],
                p10: yearValues[Math.floor(yearValues.length * 0.1)],
                p90: yearValues[Math.floor(yearValues.length * 0.9)],
                ...Object.fromEntries(
                  allPaths.slice(0, 8).map((p, i) => [`sim${i}`, p[y]])
                ),
              });
            }

            setResults({
              chartData,
              histogramData,
              finalValues,
              rfFinal,
              probUnderperform: (underperformCount / numSimulations) * 100,
              best: finalValues[finalValues.length - 1],
              worst: finalValues[0],
              avg: finalValues.reduce((a, b) => a + b, 0) / finalValues.length,
            });
            setIsSimulating(false);
          }, 100);
        };

        useEffect(() => {
          runSimulation();
        }, []);

        return (
          <div className="min-h-screen p-4 md:p-8 font-sans text-slate-900">
            <div className="max-w-7xl mx-auto space-y-6">
              {/* Header Sectie */}
              <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div className="flex items-center gap-4">
                  <div className="p-3 bg-blue-600 rounded-xl text-white shadow-lg">
                    <Icon
                      name="Zap"
                      className="w-8 h-8"
                    />
                  </div>
                  <div>
                    <h1 className="text-2xl font-bold text-slate-900">
                      Management Simulator
                    </h1>
                    <p className="text-slate-500 text-sm italic text-wrap">
                      Strategische investeringsbeslissingen onderbouwd met AEX
                      data
                    </p>
                  </div>
                </div>
                <div className="flex bg-slate-100 p-1 rounded-xl">
                  <button
                    onClick={() => setActiveTab("simulation")}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${
                      activeTab === "simulation"
                        ? "bg-white text-blue-600 shadow-sm"
                        : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    <Icon
                      name="LayoutDashboard"
                      className="w-4 h-4"
                    />{" "}
                    Simulator
                  </button>
                  <button
                    onClick={() => setActiveTab("explanation")}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${
                      activeTab === "explanation"
                        ? "bg-white text-blue-600 shadow-sm"
                        : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    <Icon
                      name="BookOpen"
                      className="w-4 h-4"
                    />{" "}
                    Uitleg
                  </button>
                </div>
              </header>

              {activeTab === "simulation" ? (
                <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 animate-in fade-in duration-500">
                  {/* Instellingen Kolom */}
                  <section className="lg:col-span-1 space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                      <h2 className="text-xs font-bold uppercase tracking-widest text-slate-400 mb-6 flex items-center gap-2">
                        <Icon
                          name="ShieldCheck"
                          className="w-4 h-4"
                        />{" "}
                        Parameters
                      </h2>
                      <div className="space-y-6">
                        <div>
                          <div className="flex justify-between mb-2">
                            <label className="text-sm font-bold text-slate-700">
                              Risicovrije Voet
                            </label>
                            <span className="text-sm font-bold text-orange-600 bg-orange-50 px-2 rounded">
                              {riskFreeRate}%
                            </span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="8"
                            step="0.25"
                            value={riskFreeRate}
                            onChange={(e) =>
                              setRiskFreeRate(parseFloat(e.target.value))
                            }
                            className="w-full accent-orange-500 h-2 bg-slate-200 rounded-lg appearance-none"
                          />
                        </div>
                        <div>
                          <div className="flex justify-between mb-2">
                            <label className="text-sm font-bold text-slate-700">
                              Portfolio Beta
                            </label>
                            <span className="text-sm font-bold text-blue-600 bg-blue-50 px-2 rounded">
                              {beta.toFixed(1)}
                            </span>
                          </div>
                          <input
                            type="range"
                            min="0.1"
                            max="2.5"
                            step="0.1"
                            value={beta}
                            onChange={(e) =>
                              setBeta(parseFloat(e.target.value))
                            }
                            className="w-full accent-blue-600 h-2 bg-slate-200 rounded-lg appearance-none"
                          />
                        </div>
                        <div>
                          <label className="text-sm font-bold block mb-2 text-slate-700 flex items-center gap-2">
                            <Icon
                              name="Layers"
                              className="w-4 h-4"
                            />{" "}
                            Simulaties
                          </label>
                          <select
                            value={numSimulations}
                            onChange={(e) =>
                              setNumSimulations(parseInt(e.target.value))
                            }
                            className="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                          >
                            <option value="100">100 (Snel)</option>
                            <option value="1000">1.000 (Standaard)</option>
                            <option value="5000">5.000 (Nauwkeurig)</option>
                          </select>
                        </div>
                        <button
                          onClick={runSimulation}
                          disabled={isSimulating}
                          className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 hover:bg-black transition-all transform active:scale-95"
                        >
                          <Icon
                            name="RefreshCcw"
                            className={`w-4 h-4 ${
                              isSimulating ? "animate-spin" : ""
                            }`}
                          />
                          {isSimulating ? "Simuleren..." : "Start Simulatie"}
                        </button>
                      </div>
                    </div>

                    <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl">
                      <h3 className="font-bold mb-4 text-sm flex items-center gap-2">
                        <Icon
                          name="AlertCircle"
                          className="w-4 h-4 text-orange-400"
                        />{" "}
                        Legenda
                      </h3>
                      <div className="space-y-4">
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-1 bg-orange-500 border-t border-dashed"></div>
                          <span className="text-xs font-semibold">
                            Sparen (Gegarandeerd)
                          </span>
                        </div>
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-1.5 bg-blue-600 rounded-full"></div>
                          <span className="text-xs font-semibold">
                            Beleggen (Mediaan)
                          </span>
                        </div>
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-3 bg-blue-500/20 rounded-sm"></div>
                          <span className="text-xs font-semibold">
                            80% Kansgebied
                          </span>
                        </div>
                      </div>
                    </div>
                  </section>

                  {/* Grafiek Kolom */}
                  <section className="lg:col-span-3 space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-[500px]">
                      {results && (
                        <ResponsiveContainer
                          width="100%"
                          height="100%"
                        >
                          <ComposedChart
                            data={results.chartData}
                            margin={{
                              top: 20,
                              right: 30,
                              left: 10,
                              bottom: 20,
                            }}
                          >
                            <CartesianGrid
                              strokeDasharray="3 3"
                              stroke="#f1f5f9"
                              vertical={false}
                            />
                            <XAxis
                              dataKey="year"
                              fontSize={11}
                              tickLine={false}
                              axisLine={false}
                            />
                            <YAxis
                              fontSize={11}
                              tickLine={false}
                              axisLine={false}
                              tickFormatter={(val) =>
                                `€${(val / 1000).toFixed(0)}k`
                              }
                            />
                            <Tooltip
                              contentStyle={{
                                borderRadius: "12px",
                                border: "none",
                                boxShadow: "0 10px 15px -3px rgba(0,0,0,0.1)",
                              }}
                              formatter={(value) =>
                                `€${Math.round(value).toLocaleString()}`
                              }
                            />

                            {/* Kansgebied */}
                            <Area
                              type="monotone"
                              dataKey="p90"
                              stroke="none"
                              fill="#3b82f6"
                              fillOpacity={0.15}
                              name="80% Kansgebied"
                              isAnimationActive={false}
                            />
                            <Area
                              type="monotone"
                              dataKey="p10"
                              stroke="none"
                              fill="#ffffff"
                              fillOpacity={1}
                              legendType="none"
                              isAnimationActive={false}
                            />

                            {/* Individuele samples */}
                            {Array.from({ length: 8 }).map((_, i) => (
                              <Line
                                key={i}
                                type="monotone"
                                dataKey={`sim${i}`}
                                stroke="#2563eb"
                                strokeWidth={1}
                                strokeOpacity={0.15}
                                dot={false}
                                legendType="none"
                                isAnimationActive={false}
                              />
                            ))}

                            {/* Statistiek grenzen */}
                            <Line
                              type="monotone"
                              dataKey="p90"
                              stroke="#64748b"
                              strokeWidth={1}
                              strokeDasharray="4 4"
                              dot={false}
                              legendType="none"
                              isAnimationActive={false}
                            />
                            <Line
                              type="monotone"
                              dataKey="p10"
                              stroke="#64748b"
                              strokeWidth={1}
                              strokeDasharray="4 4"
                              dot={false}
                              legendType="none"
                              isAnimationActive={false}
                            />

                            {/* Hoofdlijnen */}
                            <Line
                              type="monotone"
                              dataKey="riskFree"
                              stroke="#f59e0b"
                              strokeWidth={4}
                              strokeDasharray="8 4"
                              name="Sparen"
                              isAnimationActive={false}
                              dot={{
                                r: 4,
                                fill: "#f59e0b",
                                strokeWidth: 2,
                                stroke: "#fff",
                              }}
                            />
                            <Line
                              type="monotone"
                              dataKey="median"
                              stroke="#1d4ed8"
                              strokeWidth={5}
                              name="Beleggen"
                              isAnimationActive={false}
                              dot={{
                                r: 5,
                                fill: "#1d4ed8",
                                strokeWidth: 2,
                                stroke: "#fff",
                              }}
                            />

                            <Legend
                              verticalAlign="top"
                              height={60}
                              iconType="plainline"
                            />
                          </ComposedChart>
                        </ResponsiveContainer>
                      )}
                    </div>

                    {/* Scorekaarten */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center">
                        <div className="p-2 bg-orange-100 rounded-lg text-orange-600 mb-2">
                          <Icon
                            name="ShieldCheck"
                            className="w-5 h-5"
                          />
                        </div>
                        <p className="text-slate-400 text-[10px] font-bold uppercase mb-1">
                          Sparen (Zekerheid)
                        </p>
                        <p className="text-2xl font-black text-slate-800">
                          €
                          {results
                            ? Math.round(results.rfFinal).toLocaleString()
                            : "..."}
                        </p>
                      </div>
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center">
                        <div className="p-2 bg-blue-100 rounded-lg text-blue-600 mb-2">
                          <Icon
                            name="TrendingUp"
                            className="w-5 h-5"
                          />
                        </div>
                        <p className="text-slate-400 text-[10px] font-bold uppercase mb-1">
                          Beleggen (Gemiddeld)
                        </p>
                        <p className="text-2xl font-black text-blue-600">
                          €
                          {results
                            ? Math.round(
                                results.chartData[10].median
                              ).toLocaleString()
                            : "..."}
                        </p>
                      </div>
                      <div className="bg-rose-50 p-6 rounded-2xl border border-rose-100 shadow-sm flex flex-col items-center">
                        <div className="p-2 bg-rose-100 rounded-lg text-rose-600 mb-2">
                          <Icon
                            name="ArrowDownCircle"
                            className="w-5 h-5"
                          />
                        </div>
                        <p className="text-rose-900 text-[10px] font-bold uppercase mb-1 text-opacity-60">
                          Risico-Index
                        </p>
                        <p className="text-2xl font-black text-rose-600">
                          {results
                            ? results.probUnderperform.toFixed(1)
                            : "..."}
                          %
                        </p>
                        <p className="text-[10px] text-rose-700 font-medium text-center">
                          Kans op lagere waarde dan sparen
                        </p>
                      </div>
                    </div>

                    {/* Extremen */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 shadow-sm flex items-center gap-4">
                        <div className="p-3 bg-emerald-100 rounded-full text-emerald-600">
                          <Icon
                            name="Trophy"
                            className="w-6 h-6"
                          />
                        </div>
                        <div>
                          <p className="text-emerald-900 text-[10px] font-bold uppercase tracking-widest text-opacity-60">
                            "Geluksvogel" Scenario
                          </p>
                          <p className="text-2xl font-black text-emerald-700">
                            €
                            {results
                              ? Math.round(results.best).toLocaleString()
                              : "..."}
                          </p>
                        </div>
                      </div>
                      <div className="bg-slate-200 p-6 rounded-2xl border border-slate-300 shadow-sm flex items-center gap-4 text-slate-700">
                        <div className="p-3 bg-slate-300 rounded-full">
                          <Icon
                            name="AlertCircle"
                            className="w-6 h-6"
                          />
                        </div>
                        <div>
                          <p className="text-slate-900 text-[10px] font-bold uppercase tracking-widest text-opacity-60">
                            "Pechvogel" Scenario
                          </p>
                          <p className="text-2xl font-black">
                            €
                            {results
                              ? Math.round(results.worst).toLocaleString()
                              : "..."}
                          </p>
                        </div>
                      </div>
                    </div>
                  </section>
                </div>
              ) : (
                /* Uitleg Tabblad */
                <div className="bg-white p-8 rounded-3xl border border-slate-200 max-w-4xl mx-auto space-y-10 animate-in fade-in slide-in-from-bottom-4 duration-500">
                  <section>
                    <h2 className="text-3xl font-black text-slate-900 mb-6 underline decoration-blue-500 underline-offset-8">
                      Uitleg voor Bedrijfskunde Studenten
                    </h2>
                    <div className="space-y-6 text-slate-700 leading-relaxed">
                      <p>
                        In de bedrijfswereld neem je beslissingen op basis van
                        onzekerheid. Een <strong>Monte Carlo simulatie</strong>{" "}
                        helpt je door de toekomst niet één keer te voorspellen,
                        maar duizenden keren na te spelen.
                      </p>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-8 py-4">
                        <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                          <h3 className="text-lg font-bold text-blue-900 mb-4">
